[package]
name = "pvd-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
blake3 = "=1.8.7"
pvd-protocol.workspace = true
pvd-core.workspace = true
pvd-transport.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
ctrlc = "=3.5.2"
